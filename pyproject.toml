[build-system]
requires = ["setuptools>=64", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "hackablegrid"
version = "0.1.0"
description = "C++ vectorized gridworld engine with PPO and a reward-hacking detector"
requires-python = ">=3.10"
dependencies = ["numpy", "gymnasium>=1.0", "torch", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["hackablegrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
